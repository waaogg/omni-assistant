version: '3.8'

services:
  # Omni-Assistant 微信 iLink、agy 与 Microsoft To Do 服务
  omni-assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: omni-assistant
    restart: always
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    networks:
      - assistant-net

networks:
  assistant-net:
    driver: bridge
